<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b10">
<title>NULL_SIGNAL // Archive 07</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#0e141c;--line:#263342;--text:#e3edf4;--muted:#8ba0b2;--cyan:#7de5d1;--amber:#f2c879;--red:#ff776f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#13212a 0%,var(--bg) 60%);color:var(--text);font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{width:min(760px,100%);margin:0 auto;padding:28px 18px 52px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:28px}
.brand{font-size:.82rem;letter-spacing:.14em;color:var(--cyan)}.status{font-size:.72rem;color:var(--muted);text-align:right}
.tag{font-size:.72rem;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
h1{font-size:clamp(2rem,9vw,4.6rem);line-height:1.02;letter-spacing:-.06em;margin:10px 0 14px;overflow-wrap:anywhere}
h2{font-size:1.15rem;margin:0 0 12px;color:var(--cyan)}
p{margin:10px 0 16px}.muted{color:var(--muted)}
.panel{background:rgba(14,20,28,.9);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,5vw,28px);box-shadow:0 18px 55px #0003}
.rule{height:1px;background:var(--line);margin:22px 0}
button,input{font:inherit;border-radius:4px}button{border:1px solid var(--cyan);background:var(--cyan);color:#06110f;font-weight:700;padding:11px 16px;cursor:pointer}button:hover{filter:brightness(1.08)}button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}.secondary{background:transparent;color:var(--cyan);border-color:var(--line)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.field{display:flex;gap:8px;margin-top:16px}.field input{min-width:0;flex:1;background:#070a0e;border:1px solid #354555;color:var(--text);padding:12px}.field input::placeholder{color:#637688}
.progress{display:flex;gap:7px;margin:16px 0 24px}.dot{height:4px;flex:1;background:#263342;border-radius:3px}.dot.done{background:var(--cyan)}
.poem{border-left:2px solid var(--cyan);padding:4px 0 4px 18px;margin:18px 0;color:#d2e3eb;white-space:pre-line}
.cipher{border:1px dashed #516575;background:#080c11;padding:15px;border-radius:4px;overflow-wrap:anywhere;letter-spacing:.04em;color:var(--amber)}
.feedback{min-height:1.5em;margin-top:12px;font-size:.9rem;color:var(--muted)}.feedback.good{color:var(--cyan)}.feedback.bad{color:var(--red)}
footer{margin-top:26px;font-size:.73rem;color:#6f8495;text-align:center}
.seal{font-size:clamp(3rem,15vw,6rem);line-height:1;text-align:center;color:var(--cyan);margin:16px 0;letter-spacing:.08em}.reward{border:1px solid #927943;background:#1e1a11;padding:14px;margin:22px 0;color:#f5d79b}.small{font-size:.78rem;color:var(--muted)}
@media(max-width:480px){.field{flex-direction:column}.field button{width:100%}header{align-items:flex-start}}
</style>
</head>
<body>
<main>
<header><div class="brand">[ NULL_SIGNAL ]</div><div class="status">PUBLIC ARCHIVE NODE 07<br><span id="headerState">CONNECTION UNVERIFIED</span></div></header>
<section id="app" class="panel" aria-live="polite"></section>
<footer>NO LOCATION TRACKING · NO DOWNLOADS REQUIRED · FICTIONAL PUZZLE EXPERIENCE</footer>
</main>
<script>
const app = document.getElementById('app');
let stage = 0;
const stages = [
  {
    label:'ENTRY 01 / THE TRACE', title:'Read the first signal',
    body:`The archive labels every recovered record by its first trace. Read the left edge.`,
    puzzle:`Nights swallow forgotten records.\nUnder static, a faint pulse remains.\nLost files are rarely lost.\nLook first, not last.\nSilence keeps the checksum.\nIndex the first mark.\nGhosts wait in plain sight.\nNothing here is random.\nA name survives the noise.\nLetters first, always.`,
    question:'What name appears in the first letters?', answer:'NULLSIGNAL',
  },
  {
    label:'ENTRY 02 / THE TRANSLATION', title:'The machine speaks in blocks',
    body:'The next rule was stored in Base64. Decode the block, then enter the instruction with no spaces.',
    puzzle:'U0hJRlQgMyBMRVRURVJT', question:'What rule does the block reveal?', answer:'SHIFT3',
  },
  {
    label:'ENTRY 03 / THE ROTATION', title:'Move against the alphabet',
    body:'Use the rule from the previous record. Move each letter three places backward. Keep the punctuation.',
    puzzle:'WKH ILQDO UHFRUG LV FDOOHG WLEUR. UHYHUVH WKH QDPH WR ILQG WKH NHB.',
    question:'What is the record name?', answer:'ORBIT',
  },
  {
    src="evidence-04.png"
    alt="Recovered archive evidence"
    style="max-width:100%;"
  },
  {
    label:'ENTRY 04 / THE HIDDEN INDEX', title:'The page has another layer',
    body:'The final lock has no key in the visible transcript. The record is stored twice, once in the page itself. Find the hexadecimal file ID in the HTML source and translate it into text. Enter the file name without the hyphen.',
    puzzle:'SOURCE REQUIRED · FILE INDEX ENCRYPTED AS HEX',
    question:'What is the file ID?', answer:'ARCHIVE07',
  }
];
function normalize(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
function progress(){return `<div class="progress" aria-label="Puzzle progress">${stages.map((_,i)=>`<span class="dot ${i<stage?'done':''}"></span>`).join('')}</div>`}
function renderIntro(){
 document.getElementById('headerState').textContent='CONNECTION UNVERIFIED';
 app.innerHTML=`<div class="tag">Recovered file // 07</div><h1>NULL_<br>SIGNAL</h1><p class="muted">A four-layer internet mystery about an archive that should not exist.</p><div class="rule"></div><p>On 14 October, the fictional Northbridge Archive marked one record as deleted. The next day, the index showed a blank entry with a working checksum.</p><p>Someone left a message in the damaged record:</p><div class="cipher">IF YOU CAN READ THIS, THE ARCHIVE IS STILL LISTENING.</div><p class="muted">Four locks. One hidden record. Use only the clues on this page and the page source. Answers ignore capitalization and spaces. No real-world locations, downloads, or private information are part of the puzzle.</p><div class="actions"><button id="start">ENTER THE ARCHIVE</button><button class="secondary" id="rules">PUZZLE RULES</button></div><div id="rulesBox" hidden>Answers ignore capitalization and spaces. You do not need to contact strangers, visit a location, or install anything.</div>`;
 document.getElementById('start').onclick=()=>{stage=1;renderStage()};
 document.getElementById('rules').onclick=()=>{const b=document.getElementById('rulesBox');b.hidden=!b.hidden};
}
function renderStage(){
 const s=stages[stage-1];
 document.getElementById('headerState').textContent=`RECORD ${String(stage).padStart(2,'0')} / ${stages.length}`;
 app.innerHTML=`${progress()}<div class="tag">${s.label}</div><h2>${s.title}</h2><p>${s.body}</p>${s.puzzle.includes('\\n')?`<div class="poem">${s.puzzle.replace(/\\n/g,'<br>')}</div>`:`<div class="cipher">${s.puzzle.replace(/\n/g,'<br>')}</div>`}<div class="rule"></div><label for="answer">${s.question}</label><form id="answerForm"><div class="field"><input id="answer" autocomplete="off" autocapitalize="characters" placeholder="ENTER ANSWER" aria-label="Your answer" required><button type="submit">VERIFY</button></div></form><div id="feedback" class="feedback" role="status"></div><div class="actions"><button id="restart" class="secondary" type="button">RESET PUZZLE</button></div>`;
 document.getElementById('answerForm').onsubmit=(e)=>{e.preventDefault();const val=normalize(document.getElementById('answer').value);const fb=document.getElementById('feedback');if(val===s.answer){fb.className='feedback good';fb.textContent='MATCH CONFIRMED. RECORD UNLOCKED.';setTimeout(()=>{if(stage<stages.length){stage++;renderStage()}else{renderFinal()}},550)}else{fb.className='feedback bad';fb.textContent='NO MATCH. CHECK THE CLUE AND TRY AGAIN.'}};
 document.getElementById('restart').onclick=()=>{stage=0;renderIntro()};
}
function renderFinal(){
 document.getElementById('headerState').textContent='ALL RECORDS VERIFIED';
 app.innerHTML=`<div class="tag">Archive 07 / Declassified</div><div class="seal">ACCESS<br>GRANTED</div><p class="muted" style="text-align:center">FOUR LOCKS CLEARED · NULL_SIGNAL COMPLETE</p><div class="rule"></div><h2>THE SECRET OF THE ARCHIVE</h2><p>The deleted records were never destroyed. The Archivist moved them into a shadow index after learning the archive had begun recording the names of people who searched it.</p><p>The blank entry was a warning, not an error. The Archivist signed the final message with one name:</p><div class="cipher" style="text-align:center;font-size:1.4rem">NULL</div><p>“A record is not gone while someone remembers to look for it.”</p><div class="reward"><strong>PUZZLE COMPLETE</strong><br>Your in-story reward: <strong>₱500</strong><br><span class="small">This is a fictional story reward, not a promise of real-world payment.</span></div><p>Congratulations. You solved the advanced NULL_SIGNAL puzzle and recovered the hidden archive record.</p><div class="actions"><button id="again">PLAY AGAIN</button><button class="secondary" id="copyCode">COPY COMPLETION CODE</button></div><div id="copied" class="feedback" role="status"></div>`;
 document.getElementById('again').onclick=()=>{stage=0;renderIntro()};
 document.getElementById('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText('NULL_SIGNAL-ARCHIVE07-ORBIT');document.getElementById('copied').textContent='Completion code copied.'}catch(e){document.getElementById('copied').textContent='Completion code: NULL_SIGNAL-ARCHIVE07-ORBIT'}};
}
renderIntro();
</script>
<!-- The final layer is intentionally hidden in the source, like a classic internet puzzle clue. -->
<!-- FILE_ID_HEX=415243484956452D3037 -->
</body>
</html>
